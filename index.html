<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A Marble Madness-style 3D racer: roll a glass marble with the Claude spark inside it down isometric courses against the clock.">
<title>Madness</title>
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div id="view"></div>

<header id="top" hidden>
  <div id="race"></div>
  <div class="time"><span class="label">time</span><span id="clock"></span></div>
  <div class="points"><span class="label">score</span><span id="score">000000</span></div>
</header>

<div id="banner" hidden></div>
<div id="pause" hidden>PAUSED<small>P to carry on</small></div>

<section id="title" hidden>
  <h1>MADNESS</h1>
  <p class="tag">a marble game</p>
  <div class="menu">
    <button id="start" type="button">START</button>
    <div id="races" aria-label="Start from a race"></div>
    <p id="best"></p>
    <p class="help">
      <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> roll</span>
      <span>hold the mouse or a finger — roll toward it</span>
      <span><kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>Z</kbd> zoom</span>
    </p>
  </div>
</section>

<button id="mute" type="button" aria-pressed="false">sound on</button>
<pre id="error" hidden></pre>

<script type="module" src="/src/main.js"></script>
</body>
</html>
